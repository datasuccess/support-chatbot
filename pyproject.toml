[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-chatbot"
version = "0.1.0"
description = "Support chatbot for the Ministry of Finance government-contracts system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "openai>=1.54",
    "sentence-transformers>=3.3",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
# The application package is api/app, importable as `app`.
packages = ["api/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["evals", "api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
# CPU-only torch: the GPU wheels are ~2.5GB and this deployment is CPU-bound.
override-dependencies = ["torch>=2.5"]
