<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dəstək köməkçisi</title>
<style>
  /* Design notes:
     - Colours meet WCAG 2.1 AA contrast against their backgrounds.
     - Focus rings are never removed; keyboard users must be able to see where
       they are. Government services are typically held to AA by law.        */
  :root {
    --bg: #ffffff;
    --panel: #f6f8fa;
    --ink: #1a1d21;
    --ink-soft: #5b6470;
    --brand: #1c5d99;
    --brand-ink: #ffffff;
    --border: #dfe3e8;
    --ok: #1a7f52;
    --warn: #9a5b00;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; font-size: 15px; line-height: 1.55;
  }
  header {
    background: var(--brand); color: var(--brand-ink);
    padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  header .title { font-weight: 600; font-size: 15px; }
  header .sub { font-size: 12px; opacity: .85; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 14px;
  }
  .msg { max-width: 88%; }
  .msg.user { align-self: flex-end; }
  .msg.bot  { align-self: flex-start; }
  .bubble {
    padding: 10px 13px; border-radius: var(--radius); white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .bot .bubble  { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bot .bubble ol { margin: 8px 0 0; padding-inline-start: 22px; }
  .bot .bubble li { margin-bottom: 4px; }
  .bot .bubble strong { font-weight: 650; }
  .sources {
    margin-top: 8px; font-size: 12px; color: var(--ink-soft);
    border-top: 1px dashed var(--border); padding-top: 6px;
  }
  .actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  button {
    font-family: var(--font); font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--ink-soft);
    border-radius: 8px; padding: 5px 9px;
  }
  button:hover { background: var(--panel); color: var(--ink); }
  button:focus-visible { outline: 3px solid #7aa7d1; outline-offset: 2px; }
  button[aria-pressed="true"] { background: #e6f2ea; border-color: var(--ok); color: var(--ok); }
  .escalate { margin-inline-start: auto; color: var(--brand); border-color: #b9d0e5; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6 } }
  footer { border-top: 1px solid var(--border); padding: 10px; flex-shrink: 0; background: var(--bg); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font-family: var(--font); font-size: 15px;
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    max-height: 120px; min-height: 40px; color: var(--ink);
  }
  textarea:focus-visible { outline: 3px solid #7aa7d1; outline-offset: 1px; border-color: var(--brand); }
  .send {
    background: var(--brand); color: var(--brand-ink); border-color: var(--brand);
    padding: 9px 15px; font-weight: 600; border-radius: 10px;
  }
  .send:hover:not(:disabled) { background: #17507f; color: #fff; }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  .disclaimer { font-size: 11px; color: var(--ink-soft); margin-top: 7px; text-align: center; }
  .csat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .csat .stars { display: flex; gap: 4px; margin-top: 8px; }
  .csat button { font-size: 20px; padding: 2px 6px; line-height: 1; }
  .contact-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .contact-card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 650; }
  .contact-card p  { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); }
  .field { margin-bottom: 9px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 3px; }
  .field input {
    width: 100%; font-family: var(--font); font-size: 14px; color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .field input:focus-visible { outline: 3px solid #7aa7d1; outline-offset: 1px; border-color: var(--brand); }
  .choices { display: flex; gap: 14px; margin: 2px 0 4px; }
  .choices label { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink); }
  .form-actions { display: flex; gap: 8px; margin-top: 10px; }
  .form-actions .send { flex: 1; }
  .err { color: #b3261e; font-size: 12px; margin-top: 6px; }
  .ref {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px;
    font-weight: 650; letter-spacing: .5px; color: var(--brand);
    background: var(--bg); border: 1px dashed var(--brand); border-radius: 8px;
    padding: 7px 11px; display: inline-block; margin: 8px 0;
  }
  .header-link {
    margin-inline-start: auto; background: transparent; border: 1px solid rgba(255,255,255,.4);
    color: #fff; font-size: 12px; padding: 5px 9px; border-radius: 8px;
  }
  .header-link:hover { background: rgba(255,255,255,.14); color: #fff; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <span aria-hidden="true" style="font-size:20px">🏛️</span>
  <div>
    <div class="title">Dəstək köməkçisi</div>
    <div class="sub">Dövlət Satınalmaları Portalı</div>
  </div>
  <button type="button" class="header-link" id="contactLink">💬 Operatorla əlaqə</button>
</header>

<!-- aria-live announces streamed answers to screen-reader users. "polite" so it
     waits for a pause rather than interrupting. -->
<main id="log" role="log" aria-live="polite" aria-label="Söhbət tarixçəsi"></main>

<footer>
  <form class="composer" id="form">
    <label for="input" class="visually-hidden">Sualınızı yazın</label>
    <textarea id="input" rows="1" placeholder="Sualınızı yazın…" autocomplete="off"></textarea>
    <button type="submit" class="send" id="send">Göndər</button>
  </form>
  <div class="disclaimer">Cavablar bilik bazasına əsaslanır. Dəqiq məlumat üçün dəstəyə müraciət edin.</div>
</footer>

<script>
(function () {
  "use strict";

  /* API origin is derived from where this page was served, NOT from a query
     parameter. Reading it from the URL let anyone serve /widget?api=https://evil
     and collect every question typed into the widget. */
  const API = location.origin;
  const params = new URLSearchParams(location.search);
  const SITE_KEY = params.get("k") || "";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const contactLink = document.getElementById("contactLink");

  let token = null;          // server-issued, signed; proves this conversation is ours
  let busy = false;
  let answered = 0;
  let contactDone = false;

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  /* Escape first, then apply a deliberately tiny markdown subset. Model output is
     untrusted text; building HTML from it unescaped would be an XSS hole. */
  function renderMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const lines = html.split("\n");
    let out = "", inList = false;
    for (const line of lines) {
      const m = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
      if (m) {
        if (!inList) { out += "<ol>"; inList = true; }
        out += "<li>" + m[2] + "</li>";
      } else {
        if (inList) { out += "</ol>"; inList = false; }
        out += line + "\n";
      }
    }
    if (inList) out += "</ol>";
    return out.trim();
  }

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function addUser(text) {
    const el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = '<div class="bubble"></div>';
    el.querySelector(".bubble").textContent = text;
    log.appendChild(el); scrollDown();
  }

  function addBot() {
    const el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = '<div class="bubble"><span class="typing" aria-label="Cavab yazılır">' +
                   "<span></span><span></span><span></span></span></div>";
    log.appendChild(el); scrollDown();
    return el;
  }

  async function api(path, body) {
    const headers = { "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    const r = await fetch(API + path, { method: "POST", headers, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  async function ensureSession() {
    if (token) return token;
    const r = await fetch(API + "/api/chat/session", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ site_key: SITE_KEY })
    });
    if (!r.ok) throw new Error("session HTTP " + r.status);
    token = (await r.json()).session_token;
    return token;
  }

  /* ---------------------------------------------------------- contact form */
  function showContactForm(trigger) {
    if (contactDone) return;
    if (document.querySelector(".contact-card")) {
      document.querySelector(".contact-card input").focus();
      return;
    }
    const el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML =
      '<div class="contact-card">' +
        "<h3>💬 Operatorla əlaqə</h3>" +
        "<p>Əlaqə məlumatlarınızı qeyd edin — operatorumuz sizinlə əlaqə saxlayacaq.</p>" +
        '<div class="field"><label for="cName">Ad, soyad</label>' +
          '<input id="cName" autocomplete="name" maxlength="120"></div>' +
        '<div class="field"><label id="chLabel">Əlaqə üsulu</label>' +
          '<div class="choices" role="radiogroup" aria-labelledby="chLabel">' +
            '<label><input type="radio" name="ch" value="phone" checked> Telefon</label>' +
            '<label><input type="radio" name="ch" value="email"> E-poçt</label>' +
          "</div></div>" +
        '<div class="field" id="phoneField"><label for="cPhone">Telefon nömrəsi</label>' +
          '<input id="cPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+994 __ ___ __ __"></div>' +
        '<div class="field" id="emailField" style="display:none"><label for="cEmail">E-poçt</label>' +
          '<input id="cEmail" type="email" autocomplete="email" placeholder="ad@nümunə.az"></div>' +
        '<div class="field"><label for="cNote">Qeyd (istəyə bağlı)</label>' +
          '<input id="cNote" maxlength="2000" placeholder="Nə ilə bağlı kömək lazımdır?"></div>' +
        '<div class="form-actions">' +
          '<button type="button" class="send" id="cSend">Göndər</button>' +
          '<button type="button" id="cCancel">Ləğv et</button>' +
        "</div>" +
        '<div class="err" id="cErr" role="alert" style="display:none"></div>' +
      "</div>";
    log.appendChild(el); scrollDown();

    const card = el.querySelector(".contact-card");
    const phoneField = card.querySelector("#phoneField");
    const emailField = card.querySelector("#emailField");
    const err = card.querySelector("#cErr");

    card.querySelectorAll('input[name="ch"]').forEach(radio => {
      radio.addEventListener("change", () => {
        const phone = card.querySelector('input[name="ch"]:checked').value === "phone";
        phoneField.style.display = phone ? "" : "none";
        emailField.style.display = phone ? "none" : "";
      });
    });

    card.querySelector("#cCancel").onclick = () => { el.remove(); input.focus(); };

    card.querySelector("#cSend").onclick = async () => {
      const name = card.querySelector("#cName").value.trim();
      const channel = card.querySelector('input[name="ch"]:checked').value;
      const phone = card.querySelector("#cPhone").value.trim();
      const email = card.querySelector("#cEmail").value.trim();
      const note = card.querySelector("#cNote").value.trim();

      const fail = (m) => { err.textContent = m; err.style.display = ""; };
      if (name.length < 2) return fail("Zəhmət olmasa ad və soyadınızı yazın.");
      if (channel === "phone" && phone.length < 7) return fail("Zəhmət olmasa telefon nömrənizi yazın.");
      if (channel === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        return fail("Zəhmət olmasa düzgün e-poçt ünvanı yazın.");
      }
      err.style.display = "none";
      card.querySelector("#cSend").disabled = true;

      try {
        const res = await api("/api/chat/contact", {
          name: name, channel: channel,
          phone: phone || null, email: email || null,
          note: note || (trigger || null)
        });
        contactDone = true;
        contactLink.style.display = "none";
        card.innerHTML =
          "<h3>✅ Müraciətiniz qeydə alındı</h3>" +
          "<p>Operatorumuz ən qısa zamanda sizinlə əlaqə saxlayacaq.</p>" +
          '<div class="ref">' + escapeHtml(res.reference_code) + "</div>" +
          "<p>Bu nömrəni yadda saxlayın — müraciətinizlə bağlı sorğu zamanı lazım ola bilər.</p>";
        scrollDown();
      } catch (e) {
        card.querySelector("#cSend").disabled = false;
        fail("Göndərmək alınmadı. Zəhmət olmasa yenidən cəhd edin.");
      }
    };

    card.querySelector("#cName").focus();
  }

  contactLink.addEventListener("click", () => showContactForm(null));

  /* ------------------------------------------------------------- answering */
  function addFooter(el, meta, question) {
    const bubble = el.querySelector(".bubble");

    if (meta.sources && meta.sources.length) {
      const src = document.createElement("div");
      src.className = "sources";
      src.textContent = "📎 Mənbə: " + meta.sources.map(s => s.citation || s.title).join(" · ");
      bubble.appendChild(src);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    /* Ratings only on real answers. Asking someone to rate a refusal measures
       nothing useful and just adds noise to the queue. */
    if (meta.message_id && meta.mode === "grounded") {
      [["👍", 1, "Faydalı oldu"], ["👎", -1, "Faydalı olmadı"]].forEach(([icon, value, label]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = icon;
        b.setAttribute("aria-label", label);
        b.setAttribute("aria-pressed", "false");
        b.onclick = async () => {
          actions.querySelectorAll("[aria-pressed]").forEach(x => x.setAttribute("aria-pressed", "false"));
          b.setAttribute("aria-pressed", "true");
          try { await api("/api/chat/rate", { message_id: meta.message_id, value: value }); }
          catch (e) { /* a failed rating must not break the conversation */ }
          /* Two thumbs-down in a row means the bot is not helping. Offer a human
             rather than letting the user keep trying. */
          if (value === -1 && ++negatives >= 2) showContactForm(question);
        };
        actions.appendChild(b);
      });
    }

    /* The handover is offered when the bot actually fell short — not under every
       answer. A permanent "contact support" button beneath every reply signals no
       confidence in the bot and trains people to skip straight past it. */
    if (meta.offer_contact && !contactDone) {
      const esc = document.createElement("button");
      esc.type = "button"; esc.className = "escalate";
      esc.textContent = "💬 Operatorla əlaqə";
      esc.onclick = () => showContactForm(question);
      actions.appendChild(esc);
    }

    if (actions.children.length) bubble.appendChild(actions);
    if (meta.mode === "grounded" && ++answered === 3) setTimeout(showCsat, 900);
  }

  let negatives = 0;

  function showCsat() {
    if (document.querySelector(".csat")) return;
    const el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = '<div class="csat"><div>⭐ Bu söhbət nə dərəcədə faydalı oldu?</div>' +
      '<div class="stars" role="group" aria-label="Qiymətləndirmə, 1-dən 5-ə"></div></div>';
    const stars = el.querySelector(".stars");
    for (let i = 1; i <= 5; i++) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = "☆";
      b.setAttribute("aria-label", i + " ulduz");
      b.onclick = async () => {
        Array.from(stars.children).forEach((c, idx) => { c.textContent = idx < i ? "★" : "☆"; });
        try { await api("/api/chat/csat", { score: i }); } catch (e) {}
        el.querySelector(".csat").insertAdjacentHTML("beforeend",
          '<div style="margin-top:8px;font-size:13px">Təşəkkür edirik! 🙏</div>');
      };
      stars.appendChild(b);
    }
    log.appendChild(el); scrollDown();
  }

  /* SSE over fetch rather than EventSource: EventSource cannot POST, and both the
     question and the bearer token have to travel in the request. */
  async function ask(text) {
    const el = addBot();
    const bubble = el.querySelector(".bubble");
    let acc = "", meta = {}, started = false;

    try {
      await ensureSession();
      const resp = await fetch(API + "/api/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ message: text })
      });
      if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split("\n\n");
        buffer = frames.pop() || "";
        for (const frame of frames) {
          let event = "message";
          const dataLines = [];
          for (const line of frame.split("\n")) {
            if (line.startsWith("event: ")) event = line.slice(7).trim();
            else if (line.startsWith("data: ")) dataLines.push(line.slice(6));
          }
          const data = dataLines.join("\n");
          if (event === "token") {
            if (!started) { bubble.innerHTML = ""; started = true; }
            acc += data;
            bubble.innerHTML = renderMarkdown(acc);
            scrollDown();
          } else if (event === "done") {
            try { meta = JSON.parse(data); } catch (e) { meta = {}; }
          }
        }
      }
    } catch (err) {
      bubble.innerHTML = renderMarkdown(
        "⚠️ Bağlantı xətası baş verdi. Zəhmət olmasa bir azdan yenidən cəhd edin."
      );
    }

    if (!started && !acc) bubble.innerHTML = renderMarkdown("⚠️ Cavab alınmadı.");
    addFooter(el, meta, text);
    scrollDown();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    input.value = ""; input.style.height = "auto";
    addUser(text);
    await ask(text);
    busy = false; sendBtn.disabled = false; input.focus();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  const hello = addBot();
  hello.querySelector(".bubble").innerHTML = renderMarkdown(
    "👋 Salam! Mən Dövlət Satınalmaları Portalının dəstək köməkçisiyəm.\n\n" +
    "Qeydiyyat, tenderlər, təkliflər, sənədlər və ödənişlərlə bağlı suallarınızı verə bilərsiniz."
  );
  input.focus();
})();
</script>
</body>
</html>
