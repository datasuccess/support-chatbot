services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support_chatbot_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-support_chatbot}
    ports:
      # 5434 to avoid clashing with other local Postgres instances
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-support_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
